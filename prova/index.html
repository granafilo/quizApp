<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homepage</title>
    <link rel="stylesheet" href="/prova/styles/home/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="main-container">

        <div class="homepage-title">
            Quiz App
        </div>

        <!--contenitore principale-->
        <div id="main-content" class="main-content">

            <!--scoreboard-->
            <div class="score-table-container">
                <div class="score-header-container">

                    <!--grid item-->
                    <div class="score-header nickname-header">
                        <span>Nickname</span>
                    </div>

                    <!--grid item-->
                    <div class="score-header points-header">
                        <span>Score</span>
                    </div>

                    <div class="score-header correct-header">
                        <span>Correct</span>
                    </div>

                    <div class="score-header wrong-header">
                        <span>Wrong</span>
                    </div>

                </div>
                <div id="scoreBoard" class="score-board"></div>
            </div>

            <!-- container pfp e difficoltà -->
            <div class="pfp-diff-container">
                <div class="pfp-container">
                    <button id="pfp-btn" class="pfp-btn">
                        <img id="current-pfp" class="current-pfp" src="/prova/images/profile_pics/user.svg" alt="">
                    </button>
                </div>
                <div class="diff-container">
                    <div class="diff-title">DIFFICULTY</div>
                    <select name="" id="difficulty" class="diff-select">
                        <option value="Mixed" selected>Mixed</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>

            <!-- contenitore nickname -->
            <div class="nickname-container">
                <input id="nickname" class="nickname-input" type="text" placeholder="NICKNAME">
            </div>

            <!-- contenitore start button -->
            <div class="start-btn-container">
                <button id="startGameBtn" class="start-btn">
                    Start Game
                </button>
            </div>
        </div>

        <!-- contenitore pfp stack -->
        <dialog class="pfp-picker-dialog">
            <div id="pfp-stack-container" class="pfp-stack-container">
                <div class="pfp-grid">
                    <button>
                        <img id="albino.svg" src="/prova/images/profile_pics/albino.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="alessandro.svg" src="/prova/images/profile_pics/alessandro.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="ariana.svg" src="/prova/images/profile_pics/ariana.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="balo.svg" src="/prova/images/profile_pics/balo.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="carota.svg" src="/prova/images/profile_pics/carota.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="mamma.svg" src="/prova/images/profile_pics/mamma.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="nerd.svg" src="/prova/images/profile_pics/nerd.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="prof.svg" src="/prova/images/profile_pics/prof.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="sinner.svg" src="/prova/images/profile_pics/sinner.svg" class="js-pfp" alt="">
                    </button>
                    <button>
                        <img id="topa.svg" src="/prova/images/profile_pics/topa.svg" class="js-pfp" alt="">
                    </button>
                </div>
                <div class="close-btn-container">
                    <button id="close-pfp-stack-btn" class="close-btn">CLOSE</button>
                </div>
            </div>
        </dialog>


        <dialog class="game-info-dialog">
            <div class="game-selected">
                <div class="game-info-header">
                    <div class="game-info-title">Game info</div>
                </div>

                <div class="game-info-wrapper">
                    <div class="game-info-user">username</div>
                    <div class="game-info-score">
                        <div class="game-info-score-number score-number score-number-large"></div>
                        <div class="score-caption score-caption">SCORE</div>
                    </div>
                    <div class="game-info-correct">
                        <div class="game-info-correct-number score-number score-number-small"></div>
                        <div class="score-caption">CORRECT</div>
                    </div>
                    <div class="game-info-wrong">
                        <div class="game-info-wrong-number score-number score-number-small"></div>
                        <div class="score-caption">WRONG</div>
                    </div>
                </div>

                <button class="close-btn-game-info">X CLOSE</button>
            </div>
        </dialog>


        <div class="footer">
            CIAO
        </div>
    </div>
    <script src="/prova/index.js" type="module"></script>
</body>

</html>
