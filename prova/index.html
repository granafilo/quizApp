<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homepage</title>
    <link rel="stylesheet" href="/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="main-container">

        <div class="homepage-title">
            Quiz App
        </div>

        <!--contenitore principale-->
        <div id="main-content" class="main-content">
            <!--scoreboard-->
            <div class="score-table-container">
                <div class="score-header-container">
                    <!--grid item-->
                    <div class="score-header nickname-header">
                        <span>Nickname</span>
                    </div>

                    <!--grid item-->
                    <div class="score-header points-header">
                        <span>Score</span>
                    </div>

                    <div class="score-header correct-header">
                        <span>Correct</span>
                    </div>

                    <div class="score-header wrong-header">
                        <span>Wrong</span>
                    </div>

                </div>
                <div id="scoreBoard" class="score-board">

                </div>
            </div>

            <!-- container pfp e difficoltà -->
            <div class="pfp-diff-container">
                <div class="pfp-container">
                    <button id="pfp-btn" class="pfp-btn">
                        <img id="current-pfp" src="/images/profile_pics/user.png" alt="">
                    </button>
                </div>
                <div class="diff-container">
                    <div class="diff-title">DIFFICULTY</div>
                    <select name="" id="difficulty" class="diff-select">
                        <option value="Mixed" selected>Mixed</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>
            <!-- contenitore nickname -->
            <div class="nickname-container">
                <input id="nickname" class="nickname-input" type="text" placeholder="NICKNAME">
            </div>
            <!-- contenitore start button -->
            <div class="start-btn-container">
                <button id="startGameBtn" class="start-btn">
                    Start Game
                </button>
            </div>
        </div>

        <!-- contenitore pfp stack -->
        <div id="pfp-stack-container" class="pfp-stack-container">
            <div class="pfp-grid">
                <button>
                    <img id="polar_bear.png" src="/images/profile_pics/polar_bear.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="bear.png" src="/images/profile_pics/bear.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="bird.png" src="/images/profile_pics/bird.png" class="js-pfp" alt="">
                </button>
                <button s>
                    <img id="boy.png" src="/images/profile_pics/boy.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="fox.png" src="/images/profile_pics/fox.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="ghost.png" src="/images/profile_pics/ghost.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="graphic.png" src="/images/profile_pics/graphic.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="hippo.png" src="/images/profile_pics/hippo.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="hippopotam.png" src="/images/profile_pics/hippopotam.png" class="js-pfp" alt="">
                </button>
                <button>
                    <img id="kitty.png" src="/images/profile_pics/kitty.png" class="js-pfp" alt="">
                </button>
            </div>
            <div class="close-btn-container">
                <button id="close-pfp-stack-btn" class="close-btn">Home</button>
            </div>
        </div>

        <div class="game-selected">
            <div class="game-info-header">
                <div class="game-info-title">Game info</div>
                <button class="close-btn-game-info">X</button>
            </div>

            <div class="game-info game-info-user">Username:</div>
            <div class="game-info game-info-score">Punteggio</div>
            <div class="game-info game-info-correct">Corrette</div>
            <div class="game-info game-info-wrong">Errate</div>
        </div>

        <script src="/prova/homepage.js" type="module"></script>
</body>

</html>
