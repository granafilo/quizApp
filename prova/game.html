<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game-Quiz App</title>
    <link rel="stylesheet" href="./gamepage.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <!--div per il titolo-->
        <div class="homepage-title">
            Quiz App
        </div>

        <!--div riga completa-->
        <div id="gameContainer" class="">
            <!--div contenitore gioco-->
            <div>
                <!--div riga di benvenuto e pausa-->
                <div>
                    <!--div messaggio di benvenuto-->
                    <div>
                        <div id="welcomeMessage">
                        </div>
                    </div>
                    <!--div messaggio pausa gioco-->
                    <div id="hint">
                        <div>
                            <button id="hintBtn">
                                <img src="images/light-bulb.png">
                                <span>Hint</span>
                            </button>
                            <ul id="dropdownMenu">
                                <li id="drop-item">
                                    <button id="fiftyPercent">
                                        <img src="images/50-percent.png">
                                        <span>Remove 2/4</span>
                                    </button>
                                </li>
                            </ul>
                        </div>

                        <button id="pauseBtn">
                            <img src="images/pause.png">
                        </button>
                    </div>
                </div>

                <!--div contenitore domanda-->
                <div id="pageContainer">
                    <!--testo domanda-->
                    <div>
                        <div id="domanda"></div>
                    </div>
                    <!--contenitore opzioni-->
                    <div id="option">
                        <!--da tenere perchè container di riferimento per la pressione delle opzioni-->
                        <div id="option-container"></div>
                    </div>
                </div>

                <!--contenitore btn prossima domanda e risultato risposta-->
                <div id="resultContainer">
                    <div id="answerResult">
                        Risultato Risposta
                    </div>
                    <div id="nextQuestion">
                        <button>
                            Prossima Domanda
                        </button>
                    </div>
                </div>

                <!--div contenitore menu pausa-->
                <div id="pauseMenu">
                    <!--div contenitore pulsante per tornare al gioco e per tornare alla homepage-->
                    <div>
                        <button id="continuePauseBtn">Continua</button>
                        <button id="homePageBtn" class="js-homePageBtn">Home
                            Page</button>
                    </div>
                </div>

                <!--div contenitore menu fine domande-->
                <div id="noMoreQuestions">
                    <!--div contenitore score finale-->
                    <div id="scoreDiv">
                        Score: x Corrette, y Errate
                    </div>
                    <!--div contenitore per tornare alla home page-->
                    <div>
                        <button id="homePageBtn2">Home
                            Page</button>
                    </div>
                </div>

                <!--icona di loading-->
                <div id="loading">
                    <img src="images/loading.gif">
                </div>
            </div>

        </div>


        <script src="./game.js" type="module"></script>

</body>

</html>
