<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playing-Quiz App</title>
    <link rel="stylesheet" href="/prova/styles/game/gamepage.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-container">

        <div class="homepage-title">
            Quiz App
        </div>

        <!--main contenitore-->
        <div class="main-content">
            <!--riga per pfp, aiuti, pausa-->
            <div class="header-row">
                <div id="welcomeMessage" class="welcome-icon-container">
                </div>
                <div class="button-container">
                    <div class="hint-section">
                        <button id="hintBtn" class="hint-btn">
                            <img src="images/light-bulb.png" class="hint-logo">
                            <span>Hint</span>
                        </button>
                        <button id="fiftyPercent" class="fifty-hint-btn d-none">
                            <img src="images/50-percent.png" class="fifty-hint-logo">
                            <span>Remove 2/4</span>
                        </button>
                    </div>
                    <div class="pause-section">
                        <button id="pauseBtn" class="pause-btn">
                            <img src="images/pause.png" class="pause-logo">
                        </button>
                    </div>
                </div>
            </div>

            <div class="game-wrapper">
                <!--container per il box di gioco-->
                <div id="pageContainer" class="page-container">

                    <!--container per la domanda-->
                    <div class="question-text-box">
                        <div id="domanda"></div>
                    </div>
                    <!--container per le opzioni-->
                    <div>
                        <div id="option">
                            <div id="option-container" class="option-container">
                            </div>
                        </div>
                    </div>



                    <div id="loading" class="loading-container">
                        <img src="images/loading.gif">
                    </div>
                </div>

                <div id="pauseMenu" class="pause-container ">
                    <button id="backToGame" class="play-btn">
                        <img src="/images/play.png" alt="return to the game">
                    </button>
                    <button class="homepage-btn js-homePageBtn">
                        <img src="/images/homepage.png" alt="back to the home page">
                    </button>
                </div>

            </div>

            <div id="noMoreQuestions" class="no-more-question-container d-none">
                <div class="final-score">
                    <div id="finalScore" class="score-number">
                    </div>
                    <div class="score-caption">
                        SCORE
                    </div>
                </div>
                <div class="score-division">
                    <div class="correct-container">
                        <div id="correctFinalScore" class="score-number">
                        </div>
                        <div class="score-caption">
                            CORRETTE
                        </div>
                    </div>
                    <div class="wrong-container">
                        <div id="wrongFinalScore" class="score-number">
                        </div>
                        <div class="score-caption">
                            ERRATE
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultContainer" class="result-container d-none">
                <button id="nextQuestion" class="next-question-btn">
                    Prossima Domanda
                </button>
            </div>

            <div id="backHome" class="back-home-container d-none">
                <button id="nextQuestion" class="back-home-btn js-homePageBtn">
                    <img src="/images/homepage.png" alt="">
                    <span>HomePage</span>
                </button>
            </div>

        </div>

        <div class="footer">
            <p>
                Quiz questions sourced from <a href="https://opentdb.com/" target="_blank"><strong>Open Trivia DB</strong></a>. <br>
                Licensed under
                <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank"
                    rel="license noopener noreferrer">
                    Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
                </a>.
            </p>
        </div>

    </div>


    <script src="./game.js" type="module"></script>

</body>

</html>
